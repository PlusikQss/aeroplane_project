[project]
name = "aeroplane-project"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["requests>=2.31.0"]
authors = [{name = "Alexandr Korolev", email = "plusikqss@ya.ru"}]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
py-modules = ["main"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]